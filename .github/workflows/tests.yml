name: MBF Stock tests
on:
  push:
    branches: [supabase-postgres]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q server.py database_repository.py inventory_service.py security_service.py
      - name: Unit tests
        env:
          DATABASE_URL: ''
          MBF_ADMIN_PASSWORD: ci-admin-test-password
          MBF_OPERADOR_PASSWORD: ci-operator-test-password
        run: python -m unittest discover -v
